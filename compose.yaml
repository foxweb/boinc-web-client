services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: boinc-web-client:local
    container_name: boinc-monitor
    restart: unless-stopped
    # Host network so the container can reach BOINC GUI RPC on localhost:31416
    # (Docker bridge IPs are not in remote_hosts.cfg).
    network_mode: host
    environment:
      PORT: ${PORT:-8080}
      BOINC_HOST: ${BOINC_HOST:-127.0.0.1}
      BOINC_PORT: ${BOINC_PORT:-31416}
      BOINC_PASSWORD: ${BOINC_PASSWORD:?Set BOINC_PASSWORD in .env}
      HISTORY_INTERVAL_MS: ${HISTORY_INTERVAL_MS:-5000}
      HISTORY_MAX_POINTS: ${HISTORY_MAX_POINTS:-240}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
