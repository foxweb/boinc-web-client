services:
  # Forwards docker0 -> localhost BOINC GUI RPC (host network).
  boinc-proxy:
    image: boinc-web-client:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boinc-monitor-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      PROXY_BIND: ${PROXY_BIND:-172.17.0.1}
      PROXY_PORT: ${PROXY_PORT:-31417}
      BOINC_HOST: 127.0.0.1
      BOINC_PORT: ${BOINC_PORT:-31416}
    command: ["node", "server/boincProxy.js"]
    healthcheck:
      disable: true

  web:
    image: boinc-web-client:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boinc-monitor
    restart: unless-stopped
    depends_on:
      - boinc-proxy
    ports:
      - "${PORT:-8080}:8080"
    # Join docker0 so the container can reach the host-network proxy on 172.17.0.1
    networks:
      - default
      - docker_bridge
    environment:
      PORT: 8080
      BOINC_HOST: ${PROXY_BIND:-172.17.0.1}
      BOINC_PORT: ${PROXY_PORT:-31417}
      BOINC_PASSWORD: ${BOINC_PASSWORD:?Set BOINC_PASSWORD in .env}
      HISTORY_INTERVAL_MS: ${HISTORY_INTERVAL_MS:-5000}
      HISTORY_MAX_POINTS: ${HISTORY_MAX_POINTS:-240}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  docker_bridge:
    external: true
    name: bridge
