services:
  boinc-proxy:
    image: boinc-web-client:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boinc-monitor-proxy
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      BOINC_SOCKET: /boinc-ipc/gui_rpc.sock
      BOINC_HOST: 127.0.0.1
      BOINC_PORT: ${BOINC_PORT:-31416}
    volumes:
      - boinc_ipc:/boinc-ipc
    command: ["node", "server/boincProxy.js"]
    healthcheck:
      disable: true

  web:
    image: boinc-web-client:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boinc-monitor
    restart: unless-stopped
    depends_on:
      - boinc-proxy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      BOINC_SOCKET: /boinc-ipc/gui_rpc.sock
      BOINC_PASSWORD: ${BOINC_PASSWORD:?Set BOINC_PASSWORD in .env}
      HISTORY_INTERVAL_MS: ${HISTORY_INTERVAL_MS:-5000}
      HISTORY_MAX_POINTS: ${HISTORY_MAX_POINTS:-240}
    volumes:
      - boinc_ipc:/boinc-ipc
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  boinc_ipc:
